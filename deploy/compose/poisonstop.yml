# Configuração do PoisonStop para o exemplo.
default_mode: learn          # learn | monitor | enforce
learn_period: 7d

proxy:
  listen: ":3128"

# Resolver filtrado na rede apps. Em enforce, só resolve nomes da whitelist.
dns:
  listen: ":53"
  # upstream: 1.1.1.1:53   # padrão: o DNS do próprio container (Docker)

# Modo transparente: recebe o tráfego desviado pelo sidecar netfilter
# (docker-compose.transparent.yml). Fica parado se ninguém desviar nada.
transparent:
  http_listen: ":3180"
  tls_listen: ":3443"

panel:
  listen: ":8080"
  # O painel recusa acessos vindos da rede dos serviços monitorados.
  deny_cidrs: ["10.89.0.0/24"]

identify:
  # docker-socket-proxy somente leitura (mapeia IP -> container).
  docker_host: http://docker-proxy:2375
  # Alternativa sem Docker: IPs fixos.
  # static_ips:
  #   10.89.0.10: app

data:
  path: /data/poisonstop.db

# Regras por serviço. Sem regra, vale o default_mode.
services:
  app:
    mode: learn
  worker:
    # monitor: deixa passar, mas alerta o que estiver fora da lista.
    # Troque para enforce para bloquear de verdade.
    mode: monitor
    allow:
      - api.telegram.org:443

alerts:
  debounce: 10m              # no máximo 1 alerta por serviço+evento+host nesse intervalo
  webhook:
    url: http://alert-sink:8080/poisonstop
    secret_env: POISONSTOP_WEBHOOK_SECRET   # assina com HMAC-SHA256 (X-PoisonStop-Signature)
  # telegram:
  #   bot_token_env: POISONSTOP_TG_TOKEN
  #   chat_id: "123456"
